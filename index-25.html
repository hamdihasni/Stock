function aiClient(c){
  const b=bal(c.id),d=daysLate(c.id),l=txs.filter(t=>t.clientId===c.id).sort((x,y)=>y.date.localeCompare(x.date)),bought={};

function aiTop(){const a=soldAgg();if(!a.length)return 'Pas encore de ventes enregistrées avec le détail des pièces. Utilisez −1 sur une pièce, ou un crédit avec des pièces choisies.';return '🏆 Pièces les plus vendues :\n'+a.slice(0,5).map(([n,q],i)=>`${i+1}. ${n} — ${q} vendue(s)`).join('\n')}
function aiMargin(){
  let m=0,n=0;const cost=id=>{const p=parts.find(x=>x.id===id);return p?(p.buy||0):null};

  if((/\bnotes?\b/.test(q)&&!has(q,'redmi'))||has(q,'dicter','vocal','voix'))return '📝 Notes :\n1. Touchez 📝 Notes en haut de l’écran.\n2. Écrivez votre note, ou touchez 🎤 Dicter pour parler (Français, العربية ou English).\n3. 💾 Ajouter. Vous pouvez modifier une note avec ✏️.\nSupprimer une note (🗑) demande le mot de passe d’effacement. Si le micro ne marche pas, utilisez celui du clavier Android.';
  if(has(q,'repar')&&has(q,'comment','ajout','enregistr','nouveau','creer','photo'))return '📱 Enregistrer un téléphone réparé :\n1. Onglet 📱 Réparés.\n2. ➕ Réparation.\n3. Choisissez la marque, prenez la 📷 photo du téléphone et la 🤳 photo du propriétaire avec l’appareil photo.\n4. Saisissez le nom et le numéro du propriétaire → 💾 Enregistrer.';
  if(has(q,'-1','moins 1','comptant','vendre une piece','vente rapide'))return '🛒 Vente rapide :\nDans 📦 Stock, le bouton −1 retire une pièce et enregistre une vente comptant au prix de vente. Un message ↩️ Annuler reste affiché 6 secondes si vous vous êtes trompé. Ces ventes alimentent Total ventes, Encaissé et pièces vendues.';
  if(has(q,'mot de passe','password'))return '🔒 Mot de passe d’effacement :\n1. Touchez ⚙️.\n2. Saisissez le mot de passe (4 caractères min.) puis 💾.\nIl protège l’effacement définitif de l’historique et la modification des totaux. Pour le changer, il faut l’ancien.';
  if(has(q,'supprim','effac','restaur','corbeille','historique'))return '🗑 Suppression et historique :\nSupprimer une pièce, un client ou une opération la place dans 🕘 Historique. ↩️ Restaurer la remet en place. « Effacer définitivement » demande le mot de passe d’effacement (à définir dans ⚙️).';
  if(has(q,'paiement','payer','regler','encaisser','verser','versement'))return '💵 Enregistrer un paiement :\n1. 👥 Clients → touchez le client.\n2. 💵 Paiement.\n3. Saisissez le montant → 💾 Enregistrer.\nLe solde baisse. Touchez 🧾 sur l’opération pour le reçu.';
  if(has(q,'recu'))return '🧾 Reçu :\nFiche client → 🧾 à côté de l’opération → 📤 Partager (image) ou 🖨️ Imprimer (ou enregistrer en PDF). La phrase « Merci de régulariser dès que possible. » s’ajoute s’il reste un solde.';
  if(has(q,'credit')&&has(q,'ajout','nouveau','creer','faire','donner','enregistr','vend'))return '💳 Enregistrer un crédit :\n1. 👥 Clients → touchez le client.\n2. 💳 Nouveau crédit.\n3. Choisissez les pièces du stock avec + et − (le montant se calcule, modifiable).\n4. 💾 Enregistrer : le stock diminue.';
  if(has(q,'type')&&has(q,'piece','ajout','nouveau','creer'))return '🧩 Ajouter un type de pièce :\n1. Onglet 📦 Stock.\n2. Faites défiler la rangée des marques jusqu’à ➕ Type.\n3. Écrivez le nom (ex : Accessoires) → 💾 Enregistrer.\nChoisissez-le ensuite dans « Marque / type de pièce » quand vous ajoutez une pièce. 🗑 Gérer permet de le supprimer.';
  if(has(q,'client')&&has(q,'ajout','nouveau','creer','enregistr'))return '👥 Ajouter un client :\n1. Onglet 👥 Clients.\n2. ➕ Client.\n3. Nom, téléphone et, si besoin, un ⏳ délai spécifique.\n4. 💾 Enregistrer.';
  if(has(q,'piece')&&has(q,'ajout','nouveau','nouvelle','creer','enregistr'))return '📦 Ajouter une pièce :\n1. Onglet 📦 Stock.\n2. ➕ Pièce (si une marque est filtrée, elle est déjà choisie).\n3. Marque, nom, catégorie, modèle, quantité et prix.\n4. 💾 Enregistrer.\nAstuce : −1 / +1 ajuste le stock, et −1 compte une vente.';
  if(has(q,'marque','galaxy','oppo','redmi','infinix','huawei')&&has(q,'comment','filtr','ajout'))return '📱 Marques :\nEn haut de 📦 Stock, touchez Galaxy, Oppo, Redmi, Infinix ou Huawei pour filtrer. ➕ Pièce Galaxy (par exemple) ajoute directement une pièce pour cette marque.\nAutre type de pièce (accessoires, chargeurs…) : touchez ➕ Type à la fin de la rangée, puis choisissez-le dans le formulaire d’une pièce.';
  if(has(q,'delai','retard')&&has(q,'comment','regler','changer','modifier','definir','choisir'))return '⏳ Délai de retard :\n• Général : ⚙️ → Délai de paiement général (7 à 90 jours).\n• Par client : ✏️ sur sa fiche → délai spécifique.\nUn client qui dépasse son délai a le signal rouge et défile dans la bande rouge sous le titre.';
  if(has(q,'devise','monnaie','boutique'))return '💱 ⚙️ → Nom de la boutique (affiché sur les reçus) et Devise (DA, DT, € …) → 💾.';
  if(has(q,'excel','export','xlsx'))return '📊 Export Excel :\n⚙️ → 📊 Excel. Le fichier contient Stock, Clients, Opérations et Ventes (−1). Une connexion internet est nécessaire ; Android propose d’enregistrer ou de partager.';
  if(has(q,'sombre','dark','theme','nuit'))return '🌙 ⚙️ → Thème : Clair, Sombre ou Automatique (selon le téléphone).';
  if(has(q,'police','taille','affichage'))return '🔤 ⚙️ → Police du texte et 🔠 Taille d’affichage (Petit à Très grand). Le réglage est propre à chaque appareil.';
  if(has(q,'apk','installer','installation','mise a jour','mettre a jour'))return '📲 Installation : ouvrez l’application et connectez-vous avec votre e-mail. Pour la mettre à jour, remplacez le fichier index.html du dépôt GitHub, puis fermez et rouvrez l’application deux fois.';
  if(has(q,'deconnex'))return '🚪 Le bouton Déconnexion est en haut à droite, sous le titre.';
  if(has(q,'hors ligne','sans internet','offline'))return '📶 Les données sont sur le cloud. Hors connexion, vous pouvez consulter et saisir : tout se synchronise au retour du réseau. L’export Excel et le premier lancement demandent internet.';
  if(has(q,'alerte','signal','bande rouge'))return '🔴 La bande rouge sous le titre liste les clients en retard (nom, jours, montant). Touchez-la pour ouvrir la liste. Un client est en retard quand son plus ancien crédit impayé dépasse son délai.';
  return null;
}
function aiAnswer(t0){
  try{
    const q=norm(t0);
    if(/^(bonjour|salut|salam|slm|hello|bonsoir|coucou|hi)\b/.test(q)&&q.length<20)return aiHello();
    if(has(q,'aide','que sais','que peux','menu','fonction')&&!has(q,'comment'))return aiMenu();
    if(has(q,'comment','how','ou est','ou puis','puis-je','puis je','ajouter','ajout','creer','nouveau','nouvelle','modifier','changer','supprimer','effacer','restaurer','installer','activer','partager','imprimer','telecharger','exporter')){const h=aiHow(q);if(h)return h}
    if(has(q,'repare','reparation'))return aiRepairs();
    if(has(q,'retard','impay','relanc'))return aiLate();
    const cl=findClients(q);if(cl.length&&!has(q,'stock'))return cl.slice(0,2).map(aiClient).join('\n\n———\n\n');
    if(has(q,'rupture','stock bas','faible','manque','epuis','reappro','racheter'))return aiLowStock();
    if(has(q,'plus vendu','meilleur','populaire','best'))return aiTop();
    if(has(q,'benefice','marge','profit','gain'))return aiMargin();
    if(has(q,'vente','vendu','revenu','encaiss','chiffre','recette'))return aiSales();
    if(has(q,'credit','dette','doit','dus','solde','devoir'))return aiCredits();
    if(has(q,'valeur'))return aiStockValue();
    const b=brandIn(q);if(b){const T=toks(q).filter(w=>!BRA[b].some(x=>x.startsWith(w)||w.startsWith(x)));const ps=parts.filter(p=>p.brand===b&&T.some(w=>norm([p.name,p.model,p.cat].join(' ')).includes(w)));return ps.length?aiParts(ps):aiBrand(b)}
    if(has(q,'stock','quantite','reste','combien','prix','disponible','piece')){const ps=findParts(q);return ps.length?aiParts(ps):aiOverview()}
    const h=aiHow(q);if(h)return h;
    const ps=findParts(q);if(ps.length)return aiParts(ps);
    return '🤔 Je n’ai pas bien compris. Vous pouvez demander par exemple :\n• Quels clients sont en retard ?\n• Combien reste-t-il d’écrans Galaxy ?\n• Quel est le total des ventes ?\n• Comment ajouter une pièce ?\nTapez « aide » pour la liste de ce que je sais faire.';
  }catch(e){return 'Oups, une erreur est survenue : '+e.message}
}

}

function stopMic(){if(REC){const r=REC;REC=null;try{r.stop()}catch(e){}}const b=$('#nmic');if(b){b.textContent='🎤 Dicter';b.classList.remove('rec')}}
function toggleMic(){
  if(REC){stopMic();return}
  if(!SR){alert("La saisie vocale n’est pas disponible ici. Astuce : utilisez le micro 🎤 du clavier Android.");return}
  const r=new SR(),ta=$('#ntx');r.lang=$('#nlang').value;r.continuous=true;r.interimResults=true;
  let base=ta.value?ta.value.trimEnd()+' ':'';
  r.onresult=e=>{let tmp='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)base+=t+' ';else tmp+=t}ta.value=base+tmp};
  r.onerror=e=>{stopMic();alert(e.error==='not-allowed'||e.error==='service-not-allowed'?'Micro refusé : autorisez le micro pour l’application, ou utilisez le micro 🎤 du clavier Android.':e.error==='no-speech'?'Aucune voix détectée.':'Saisie vocale interrompue ('+e.error+').')};
  r.onend=()=>{if(REC===r)stopMic()};
  try{r.start();REC=r;const b=$('#nmic');b.textContent='⏹️ Arrêter';b.classList.add('rec')}catch(e){alert('Impossible de démarrer la saisie vocale.')}
}

function shrink(file,max=480,q=.65){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}

function pcCalc(){return txs.filter(t=>t.type==='credit').reduce((a,t)=>a+(t.qty||0),0)+sales.reduce((a,t)=>a+(t.qty||1),0)}

function cashCalc(){return txs.filter(t=>t.type!=='credit').reduce((a,t)=>a+t.amount,0)+sales.reduce((a,t)=>a+(t.price||0)*(t.qty||1),0)}

async function saveFile(blob,name){
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function exportXlsx(){
  if(!window.XLSX){alert("Export indisponible : connexion internet requise.");return}
  const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n);
  add('Stock',[['Marque','Nom','Catégorie','Modèle','Quantité','Prix achat','Prix vente','Valeur stock'],...parts.map(p=>[p.brand||'',p.name,p.cat||'',p.model||'',p.qty||0,p.buy||0,p.sell||0,(p.qty||0)*(p.buy||0)])]);
  add('Clients',[['Nom','Téléphone','Solde dû','Jours impayés','Délai accordé (j)','En retard'],...clients.map(c=>[c.name,c.phone||'',bal(c.id),daysLate(c.id)??'',DLc(c),isLate(c)?'Oui':'Non'])]);
  add('Opérations',[['Date','Client','Type','Montant','Note'],...[...txs].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>[new Date(t.date).toLocaleDateString('fr-FR'),(clients.find(c=>c.id===t.clientId)||{}).name||'',t.type==='credit'?'Crédit':'Paiement',t.amount,txDesc(t)])]);
  add('Ventes (−1)',[['Date','Pièce','Marque','Quantité','Prix unitaire'],...[...sales].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>[new Date(t.date).toLocaleString('fr-FR'),t.name||'',t.brand||'',t.qty||1,t.price||0])]);
  add('Réparations',[['Date','Propriétaire','Téléphone','Marque','Modèle','Réparation'],...[...reps].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>[new Date(r.date).toLocaleDateString('fr-FR'),r.owner||'',r.tel||'',r.brand||'',r.model||'',r.note||''])]);
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  saveFile(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`stock-credits-${new Date().toISOString().slice(0,10)}.xlsx`);
}

function rcText(t){
  const c=clients.find(x=>x.id===t.clientId)||{},rest=balAt(t.clientId,t.date),ln='-'.repeat(24);
  return `${S.shop||'REÇU'}\n${ln}\n📅 ${new Date(t.date).toLocaleString('fr-FR')}\n👤 Client : ${c.name||''}\n${t.type==='credit'?'💳 Crédit':'💵 Paiement reçu'} : ${money(t.amount)}\n${txDesc(t)?'🔧 Détail : '+txDesc(t)+'\n':''}💰 Solde restant : ${money(rest)}\n${ln}\n${rest>0?'Merci de régulariser dès que possible.':'Merci !'}`;
}
function receipt(id){
  const t=txs.find(x=>x.id===id);if(!t)return;window._rc=rcText(t);
  $('#ov').innerHTML=`<div class="ov"><div class="md"><b>🧾 Reçu</b><pre style="white-space:pre-wrap;font:14px/1.5 monospace;margin:10px 0">${esc(_rc)}</pre><div class="row"><button class="g" onclick="closeM()">Fermer</button><span><button class="g" onclick="shareRc()">📤 Partager</button> <button onclick="printRc()">🖨️ Imprimer</button></span></div></div></div>`;
}
function shareText(){navigator.share?navigator.share({text:_rc}).catch(()=>{}):window.open('https://wa.me/?text='+encodeURIComponent(_rc))}
function printRc(){$('#rc').innerHTML=esc(_rc);window.print()}
function shareRc(){
  const lines=_rc.split('\n').flatMap(l=>l.match(/.{1,38}/g)||['']),W=640,pad=30,step=34;
  const cv=document.createElement('canvas');cv.width=W;cv.height=pad*2+lines.length*step;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,cv.height);
  x.fillStyle='#111';x.font='24px monospace';
  lines.forEach((l,i)=>x.fillText(l,pad,pad+(i+1)*step-8));
  cv.toBlob(async b=>{
    const f=new File([b],'recu.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
    shareText();
  },'image/png');
}
function remind(id){
  const c=clients.find(x=>x.id===id);
  window._rc=`Bonjour ${c.name}, petit rappel : votre solde est de ${money(bal(id))}${S.shop?' chez '+S.shop:''}. Merci de régulariser dès que possible.`;
  shareText();
}

function partForm(id){
  const p=parts.find(x=>x.id===id)||{};
  const sel=p.brand||(!id&&br&&br!=='Autre'?br:'');
  const bo='<option value="">— Autre / non précisée —</option>'+allB().map(b=>`<option ${b===sel?'selected':''}>${esc(b)}</option>`).join('');
  modal(id?'Modifier la pièce':'Nouvelle pièce',[
    {k:'brand',l:'📱 Marque / type de pièce',o:bo},{k:'name',l:'🔧 Nom (ex : Écran LCD)',v:p.name},{k:'cat',l:'🏷️ Catégorie',v:p.cat},{k:'model',l:'📟 Modèle compatible',v:p.model},
    {k:'qty',l:'🔢 Quantité en stock',t:'number',v:p.qty??0},{k:'buy',l:"💰 Prix d'achat",t:'number',v:p.buy??0},
    {k:'sell',l:'💵 Prix de vente',t:'number',v:p.sell??0},{k:'min',l:'⚠️ Seuil d’alerte (stock bas)',t:'number',v:p.min??1}],
  o=>{if(!o.name.trim())return;const d={brand:o.brand,name:o.name.trim(),cat:o.cat,model:o.model,qty:num(o.qty),buy:num(o.buy),sell:num(o.sell),min:num(o.min)};
    run(id?F().upd('parts',id,d):F().add('parts',d))},
  id?`<button class="d s" onclick="if(confirm('Supprimer cette pièce ?')){delPart('${id}')}">🗑 Suppr.</button> `:'');
}
let _tt;
function toast(html){const t=$('#toast');t.innerHTML=html;t.style.display='flex';clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',6000)}
function adj(id,n){
  const p=parts.find(x=>x.id===id);if(!p)return;
  if(n<0&&(p.qty||0)<=0)return;
  run(F().upd('parts',id,{qty:Math.max(0,(p.qty||0)+n)}));
  if(n<0){
    const sid='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    run(F().set('sales',sid,{partId:id,name:p.name,brand:p.brand||'',qty:1,price:p.sell||0,date:new Date().toISOString()}));
    toast(`<span>🛒 1 pièce vendue : ${esc(p.name)}${(p.qty||0)-1<=0?' — 🚨 rupture !':''}</span><button class="g s" style="color:#fff;border-color:#fff6" onclick="undoSale('${sid}','${id}')">↩️ Annuler</button>`);
  }
}
function undoSale(sid,pid){
  run(F().del('sales',sid));
  const p=parts.find(x=>x.id===pid);if(p)run(F().upd('parts',pid,{qty:(p.qty||0)+1}));
  $('#toast').style.display='none';
}

function clientForm(id){
  const c=clients.find(x=>x.id===id)||{};
  modal(id?'Modifier le client':'Nouveau client',[{k:'name',l:'👤 Nom',v:c.name},{k:'phone',l:'📞 Téléphone',t:'tel',v:c.phone},{k:'delay',l:'⏳ Délai spécifique en jours (vide = délai général)',t:'number',v:c.delay||''}],
  o=>{if(!o.name.trim())return;const d={name:o.name.trim(),phone:o.phone,delay:num(o.delay)||0};run(id?F().upd('clients',id,d):F().add('clients',d))},
  id?`<button class="d s" onclick="delClient('${id}')">🗑 Suppr.</button> `:'');
}
function delClient(id){if(!confirm('Supprimer ce client et son historique ?'))return;
  const c=clients.find(x=>x.id===id);if(!c)return;const l=txs.filter(t=>t.clientId===id);
  logDel('client',c.name,{id,doc:strip(c),txs:l.map(t=>({id:t.id,doc:strip(t)}))});
  l.forEach(t=>run(F().del('txs',t.id)));run(F().del('clients',id));cur=null;closeM();render()}

let CR={sel:{},q:'',manual:false};
function txDesc(t){return [(t.items||[]).map(i=>`${i.name} ×${i.qty}`).join(', '),t.note].filter(Boolean).join(' — ')}
function crList(){
  return parts.filter(p=>p.qty>0&&(p.name+' '+(p.model||'')+' '+(p.brand||'')+' '+(p.cat||'')).toLowerCase().includes(CR.q)).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--bd)"><div><b>${esc(p.name)}</b><div class="mut">${esc(p.brand||'')} ${esc(p.model||'')} · ${money(p.sell)} · stock ${p.qty}</div></div><span style="white-space:nowrap"><button class="g s" onclick="crAdj('${p.id}',-1)">−</button> <b>${CR.sel[p.id]||0}</b> <button class="g s" onclick="crAdj('${p.id}',1)">+</button></span></div>`).join('')||'<p class="mut">Aucune pièce en stock.</p>';
}
function crTotals(){const it=parts.filter(p=>CR.sel[p.id]>0);return{n:it.reduce((a,p)=>a+CR.sel[p.id],0),t:it.reduce((a,p)=>a+CR.sel[p.id]*(p.sell||0),0)}}
function crRefresh(){
  $('#crl').innerHTML=crList();const T=crTotals();
  $('#crt').textContent=`🛒 ${T.n} pièce(s) choisie(s) · total ${money(T.t)}`;
  if(!CR.manual)$('#cra').value=T.t||'';
}
function crAdj(id,d){const p=parts.find(x=>x.id===id);if(!p)return;CR.sel[id]=Math.max(0,Math.min(p.qty||0,(CR.sel[id]||0)+d));crRefresh()}
function creditForm(){
  CR={sel:{},q:'',manual:false};
  $('#ov').innerHTML=`<div class="ov"><div class="md"><b>💳 Nouveau crédit</b>
  <label>🔍 Pièces achetées (choisies dans le stock)</label>
  <input id="crq" placeholder="Chercher : nom, marque, modèle…" oninput="CR.q=this.value.toLowerCase();crRefresh()">
  <div id="crl" style="max-height:230px;overflow:auto;margin-bottom:6px"></div>
  <div class="mut" id="crt" style="margin-bottom:6px"></div>
  <label>💵 Montant (= total des pièces, modifiable)</label>
  <input id="cra" type="number" step="any" inputmode="decimal" oninput="CR.manual=true">
  <label>📝 Note</label><input id="crn">
  <div class="row"><button class="g" onclick="closeM()">✖️ Annuler</button><button onclick="crSave()">💾 Enregistrer</button></div></div></div>`;
  crRefresh();
}
function crSave(){
  const items=parts.filter(p=>CR.sel[p.id]>0).map(p=>({partId:p.id,name:p.name,brand:p.brand||'',qty:CR.sel[p.id],price:p.sell||0}));
  const total=items.reduce((a,i)=>a+i.qty*i.price,0),amt=num($('#cra').value)||total;
  if(!amt){alert('Choisissez au moins une pièce ou saisissez un montant.');return}
  run(F().add('txs',{clientId:cur,type:'credit',amount:amt,note:$('#crn').value.trim(),items,qty:items.reduce((a,i)=>a+i.qty,0),partId:items.length===1?items[0].partId:'',date:new Date().toISOString()}));
  items.forEach(i=>{const p=parts.find(x=>x.id===i.partId);if(p)run(F().upd('parts',i.partId,{qty:Math.max(0,(p.qty||0)-i.qty)}))});
  closeM();
}
function payForm(){
  modal('Paiement reçu',[{k:'amount',l:'💵 Montant',t:'number'},{k:'note',l:'📝 Note'}],
  o=>{const a=num(o.amount);if(!a)return;run(F().add('txs',{clientId:cur,type:'payment',amount:a,note:o.note,date:new Date().toISOString()}))});
}
function delTx(id){
  const t=txs.find(x=>x.id===id);if(!t||!confirm('Supprimer cette opération ?'))return;
  const c=clients.find(x=>x.id===t.clientId)||{};
  logDel('tx',`${t.type==='credit'?'Crédit':'Paiement'} ${money(t.amount)} — ${c.name||''}`,{id,doc:strip(t)});
  run(F().del('txs',id));
}
const strip=o=>{const {id,...r}=o;return r};
function logDel(kind,label,data){return run(F().add('trash',{kind,label,data,date:new Date().toISOString()}))}
function delPart(id){const p=parts.find(x=>x.id===id);if(!p)return;logDel('part',p.name,{id,doc:strip(p)});run(F().del('parts',id));closeM()}
function restore(tid){
  const e=trash.find(x=>x.id===tid);if(!e)return;const d=e.data;
  if(e.kind==='part')run(F().set('parts',d.id,d.doc));
  else if(e.kind==='client'){run(F().set('clients',d.id,d.doc));(d.txs||[]).forEach(t=>run(F().set('txs',t.id,t.doc)))}
  else{if(!clients.some(c=>c.id===d.doc.clientId)){alert("Restaurez d'abord le client de cette opération.");return}run(F().set('txs',d.id,d.doc))}
  run(F().del('trash',tid));
}
function purge(tid){askPw('Effacer définitivement cet élément ? (irréversible)',()=>run(F().del('trash',tid)))}
function purgeAll(){askPw("Vider tout l'historique ? (irréversible)",()=>trash.forEach(e=>run(F().del('trash',e.id))))}
</script></body></html>
